name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: ubuntu-latest
            target: --linux AppImage
          - os: macos-latest
            target: --mac dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run dist -- ${{ matrix.target }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Student-Notes-${{ matrix.os }}
          path: dist/
